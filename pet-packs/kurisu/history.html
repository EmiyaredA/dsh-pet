<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>红莉栖 · 动画历史版本</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eee9e4;color:#302b2a;font:14px/1.6 system-ui,-apple-system,sans-serif}main{max-width:1150px;margin:26px auto;padding:0 20px}h1{font-size:26px;margin:0}.notice{background:#fff0d2;border:1px solid #d4ae64;padding:13px 16px;border-radius:12px;margin:15px 0}.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:13px 0}button,input,a{font:inherit}button,input{padding:8px 12px;border:1px solid #bdaea4;border-radius:9px;background:#fffaf6;color:inherit}button{cursor:pointer}button[aria-pressed=true]{background:#64474e;color:#fff}button:focus-visible,input:focus-visible{outline:3px solid #ac6b88;outline-offset:2px}input{flex:1;min-width:180px}.panel{border:1px solid #d4c8be;border-radius:12px;overflow:hidden;background:#fffaf6}.title{padding:11px 15px;border-bottom:1px solid #ded2c8}.stage{aspect-ratio:16/9;position:relative;background:#fafafa}.stage.dark{background:#171821}.stage.blue{background:#153bff}.stage.checker{background:#eee;background-image:linear-gradient(45deg,#aaa 25%,transparent 25%),linear-gradient(-45deg,#aaa 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#aaa 75%),linear-gradient(-45deg,transparent 75%,#aaa 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}video{display:block;width:100%;height:100%;object-fit:contain}.detail{padding:12px 16px;white-space:pre-wrap;overflow-wrap:anywhere}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin:15px 0}.row{text-align:left;background:#fffaf6}.row strong,.row span{display:block}.row span{font-size:12px;color:#84746b}.status{color:#79695f}.small{font-size:12px;color:#807168}a{color:#784956}
</style><main>
<h1>红莉栖 · 动画历史版本</h1>
<div class="notice"><strong>历史素材仍然保留，可在这里查看。</strong><br>本页包括原片、待验收候选、已撤回和复核暂挂的版本。可播放不代表通过；这些版本不会因此加入正式桌宠播放池，也不计作新的合格动画。</div>
<div class="bar"><a href="preview.html">返回合格动画画廊</a><a href="quality/diagnostics/semantic-a105-trial-01/preview.html">查看 a105 语义抠像诊断</a><button id="refresh">刷新历史文件</button></div>
<div class="panel"><div class="title" id="title">请选择历史版本，页面不自动播放。</div><div class="stage checker" id="stage"><video id="history-video" controls loop muted playsinline preload="none" aria-label="历史动画单一播放器"></video></div><div class="detail" id="detail">仅加载点击选择的一条视频。</div></div>
<div class="bar" aria-label="背景"><button data-bg="light" aria-pressed="false">浅色</button><button data-bg="dark" aria-pressed="false">深色</button><button data-bg="checker" aria-pressed="true">棋盘</button><button data-bg="blue" aria-pressed="false">高对比蓝</button></div>
<div class="bar"><input id="search" type="search" placeholder="搜索动作、类别或版本" aria-label="搜索历史动画"></div>
<p id="status" class="status" role="status">正在读取台账并核对真实文件…</p><div id="list" class="list"></div><p class="small">原片自带背景，切换底色不会将它抠除。版本记录中的旧验收意见按历史保存，当前撤回原因优先展示。显示文件仅来自本宠物包目录；不会从临时目录复制素材。</p>
</main><script>
const video=document.querySelector('#history-video');let entries=[],query='',active='';
const labels={approved:'当前动作合格',quality_recheck_hold:'复核暂挂',quality_withdrawn:'已撤回',exhausted:'待返修',rejected:'未通过',awaiting_review:'待验收',processing_failed:'处理未通过',awaiting_source_review:'待原片验收',planned:'待生成',generating:'生成中'};
function safePath(value){if(typeof value!=='string')return null;let p=value;const marker='/pet-packs/kurisu/';if(p.includes(marker))p=p.split(marker).pop();if(p.startsWith('pet-packs/kurisu/'))p=p.slice('pet-packs/kurisu/'.length);if(p.startsWith('/')||p.includes('\\')||p.split('/').includes('..')||/^[a-z]+:/i.test(p)||!(/^(source|pet|quality)\//.test(p))||!(/\.(mp4|webm)$/i.test(p)))return null;return p;}
function mediaUrl(p){return p.split('/').map(encodeURIComponent).join('/');}
function fromLibrary(library){const result=[];for(const a of library.actions){
 const previous=a.spec_revision_history?.at(-1),oldName=previous?.previous_action_metadata?.name||a.name,oldSpec=previous?.old_spec_revision_id;
 const shared={id:a.id,current_name:a.name,group:a.group,current_status:a.status};const hold=a.quality_hold?.reason||'';
 const add=(file,version,reason,sha,name=a.name,spec=a.spec_revision_id)=>{const p=safePath(file);if(!p)return;const superseded=!!a.spec_revision_id&&spec!==a.spec_revision_id;
 result.push({...shared,name,file:p,version:version+(superseded?' · 旧规格':''),reason:(superseded?`旧规格「${name}」的历史结果，不计当前「${a.name}」完成。`:'')+(reason||hold||'尚无最终验收结论。'),sha256:sha||null,spec_revision_id:spec||null,superseded});};
 (a.attempts||[]).forEach((t,i)=>{const reason=hold||t.review?.reason||t.processing_error||'',name=t.spec_action_name||a.name,spec=t.spec_revision_id||a.spec_revision_id;add(t.source_file,`原片 · 第 ${i+1} 次生成`,reason,t.source_sha256,name,spec);add(t.candidate_file,`透明候选 · 第 ${i+1} 次生成`,reason,t.candidate_sha256,name,spec);});
 (a.withdrawn_approvals||[]).forEach((t,i)=>add(t.archive_file,`已撤回归档 · 版本 ${i+1}`,t.reason,t.sha256,t.spec_action_name||oldName,t.spec_revision_id||oldSpec));
 (a.approval_suspensions||[]).forEach((t,i)=>add(t.archive_file,`复核暂挂归档 · 版本 ${i+1}`,t.reason,t.sha256,t.spec_action_name||oldName,t.spec_revision_id||oldSpec));
 }const seen=new Set();return result.filter(e=>{if(seen.has(e.file))return false;seen.add(e.file);return true;});}
async function existing(list){const found=[];let next=0;await Promise.all(Array.from({length:4},async()=>{while(next<list.length){const e=list[next++];try{const r=await fetch(mediaUrl(e.file),{method:'HEAD',cache:'no-store'});if(r.ok)found.push(e);}catch{}}}));return found.sort((a,b)=>a.id.localeCompare(b.id)||a.version.localeCompare(b.version));}
function render(){const list=document.querySelector('#list');list.replaceChildren();const visible=entries.filter(e=>(e.id+' '+e.name+' '+e.current_name+' '+e.group+' '+e.version).toLowerCase().includes(query));for(const e of visible){const b=document.createElement('button');b.className='row';b.setAttribute('aria-pressed',String(e.file===active));const title=document.createElement('strong');title.textContent=e.name;const version=document.createElement('span');version.textContent=e.id+' · '+e.version;const state=document.createElement('span');state.textContent=labels[e.current_status]||e.current_status;b.append(title,version,state);b.onclick=()=>choose(e);list.append(b);}document.querySelector('#status').textContent=`可查看 ${visible.length} / ${entries.length} 个真实历史文件；仅当前选择的一条会解码播放。`;}
function choose(e){active=e.file;video.pause();video.removeAttribute('src');video.load();video.src=mediaUrl(e.file);video.preload='metadata';video.load();document.querySelector('#title').textContent=e.name+' · '+e.version;document.querySelector('#detail').textContent=`动作ID：${e.id}\n当前计划：${e.current_name||e.name}\n素材规格：${e.spec_revision_id||'原规格'}\n当前状态：${labels[e.current_status]||e.current_status}\n撤回／验收说明：${e.reason}\n文件：${e.file}\nSHA256：${e.sha256||'未记录，本页不补写台账'}\n历史查看，不代表合格交付。`;render();}
async function refresh(){document.querySelector('#status').textContent='正在核对台账中的实际文件…';try{const r=await fetch('library.json',{cache:'no-store'});if(!r.ok)throw Error();entries=await existing(fromLibrary(await r.json()));render();}catch{document.querySelector('#status').textContent='台账暂不可读；请通过现有本地预览服务打开。';}}
video.addEventListener('error',()=>{document.querySelector('#detail').textContent+='\n播放错误：此历史文件可能不完整或编码不受支持；未改变它的验收状态。';});
document.querySelector('#search').oninput=e=>{query=e.target.value.toLowerCase();render();};document.querySelector('#refresh').onclick=refresh;
document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{document.querySelector('#stage').className='stage '+b.dataset.bg;document.querySelectorAll('[data-bg]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});
refresh();
</script></html>
