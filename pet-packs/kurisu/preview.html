<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>红莉栖 · 动画制作进度</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eee9e4;color:#302b2a;font:14px/1.6 system-ui,-apple-system,sans-serif}main{max-width:1380px;margin:32px auto;padding:0 24px}h1{font-size:27px;margin:0 0 4px}p{color:#6c625e;margin:6px 0}button,input,a.download{font:inherit;color:inherit;border:1px solid #c9bfb8;border-radius:11px;background:#fffaf6;padding:8px 14px}button,a.download{cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#593e43;color:white;border-color:#593e43}button:disabled{cursor:default;opacity:.72}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #b97588;outline-offset:2px}.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:18px 0}.stats{padding:12px 16px;background:#e3d9d3;border-radius:12px;color:#594a45}.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.panel{min-width:0;border:1px solid #d7cec7;background:#fffaf6;border-radius:15px;overflow:hidden}.label{padding:12px 16px;border-bottom:1px solid #e6ddd6}.viewport{width:100%;aspect-ratio:16/9;overflow:hidden;position:relative}.stage{position:absolute;width:640px;height:360px;transform-origin:top left;background:#fafafa}.stage.dark{background:#171821}.stage.checker{background-color:#eee;background-image:linear-gradient(45deg,#ccc 25%,transparent 25%),linear-gradient(-45deg,#ccc 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ccc 75%),linear-gradient(-45deg,transparent 75%,#ccc 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.stage video{position:absolute;inset:0;width:640px;height:360px}.reference{position:absolute;height:290px;width:auto;left:57px;top:53px}.notice{font-size:13px;background:#f8f0e1;border:1px solid #decfb7;border-radius:12px;padding:12px 16px;margin:20px 0}.search{flex:1;min-width:180px}.categories{display:flex;gap:7px;overflow:auto;padding:2px 1px 10px}.categories button{white-space:nowrap}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px;margin:16px 0 32px}.action{display:block;text-align:left;overflow:hidden;border-radius:14px;padding:0;background:#fffaf6}.action[aria-pressed=true]{background:#f5e8e7;color:#302b2a;border:2px solid #94616c}.poster{height:130px;background:#f7f4f0;display:flex;align-items:center;justify-content:center;color:#a2968e}.poster img{width:100%;height:100%;object-fit:contain}.action-info{padding:12px}.action-name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:#8a7c74;display:flex;justify-content:space-between;gap:8px;margin-top:4px}.state-approved{color:#53775d}.state-generating{color:#a5773e}.state-awaiting_review{color:#8c6f99}.state-rejected,.state-exhausted,.state-generation_failed{color:#b45c52}#empty{padding:28px;text-align:center;color:#897a72}.footer{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0 36px}.small{font-size:12px}progress{width:100%;height:5px;accent-color:#94616c;border:0;display:block;margin:12px 0 0}@media(max-width:900px){.compare{grid-template-columns:1fr}main{margin:20px auto;padding:0 18px}h1{font-size:24px}.gallery{grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}.poster{height:110px}}
</style>
<main>
<h1>红莉栖 · 猫耳女仆动画库</h1>
<p>以定稿正面图为比例基准，逐条生成与验收。未通过的动作不会加入运行配置。</p>
<div class="stats" id="stats" role="status">正在读取制作台账…</div><progress id="progress" max="106" value="2" aria-label="验收进度"></progress>
<div class="notice" id="blocker" role="status" hidden></div>
<div class="bar" aria-label="预览背景"><button data-bg="light" aria-pressed="true">浅色</button><button data-bg="dark" aria-pressed="false">深色</button><button data-bg="checker" aria-pressed="false">透明棋盘</button><button id="pause" aria-pressed="false">暂停</button><a class="download" id="download" href="pet/kurisu-animation/待机呼吸.webm" download>下载当前动画</a></div>
<div class="compare">
<section class="panel"><div class="label">已定稿原图 · 身形比例基准</div><div class="viewport"><div class="stage"><img class="reference" src="references/kurisu-front.png" alt="猫耳女仆红莉栖定稿正面图"></div></div></section>
<section class="panel"><div class="label" id="clip-title">待机呼吸 · 640×360 · 24fps · 无音轨</div><div class="viewport"><div class="stage"><video id="pet" src="pet/kurisu-animation/待机呼吸.webm?v=2" autoplay loop muted playsinline aria-label="红莉栖动画预览"></video></div></div></section>
</div>
<div class="notice">只播放当前选中的一条视频，其余动作使用静态封面。统一保留猫耳、白色蕾丝发箍和粉色蝴蝶结，无银色发夹。轻步行走、小跑已换为向左侧身原地步态，向右由运行时镜像，窗口只沿横向移动；抱笔记本侧身挪步尚未通过。三视图仅存档，不作为身形参考。</div>
<div class="bar"><input class="search" id="search" type="search" placeholder="搜索动作名称" aria-label="搜索动作名称"><button data-status="approved" aria-pressed="true">已完成</button><button data-status="all" aria-pressed="false">全部动作</button><button data-status="pending" aria-pressed="false">待完成</button><button data-status="review" aria-pressed="false">待验收 / 返修</button></div>
<nav class="categories" id="categories" aria-label="动作分类"></nav>
<p class="small" id="result-count"></p><div class="gallery" id="gallery"></div><div id="empty" hidden>当前筛选没有动作。</div>
<div class="footer"><a class="download" href="README.md">安装与制作说明</a><a class="download" href="library.json">完整制作台账</a><a class="download" href="action-groups.json">106 条动作清单</a><a class="download" href="references/character-sheet.png">三视图记录</a></div>
</main>
<script>
const video=document.querySelector('#pet'),stages=[...document.querySelectorAll('.stage')];
let data=null,category='全部',statusFilter='approved',query='',activeId='a001',activeHash='';
const labels={awaiting_local_repair:'本地返修中',approved:'已通过',planned:'待生成',generating:'生成中',awaiting_review:'待验收',rejected:'需返修',generation_failed:'生成失败',exhausted:'待处理'};
const mediaUrl=path=>path.split('/').map(encodeURIComponent).join('/');
const resize=()=>stages.forEach(s=>s.style.transform=`scale(${s.parentElement.clientWidth/640})`);
new ResizeObserver(resize).observe(document.querySelector('.compare'));resize();
function activate(a){if(a.status!=='approved')return;activeId=a.id;const hash=a.sha256||a.file;if(hash!==activeHash){video.src=mediaUrl(a.file)+'?v='+encodeURIComponent(hash);video.play().catch(()=>{});activeHash=hash;}document.querySelector('#clip-title').textContent=`${a.name} · 640×360 · 24fps · 无音轨`;document.querySelector('#download').href=mediaUrl(a.file);document.querySelector('#pause').textContent='暂停';document.querySelector('#pause').setAttribute('aria-pressed','false');renderCards();}
function renderCards(){if(!data)return;const visible=data.actions.filter(a=>(category==='全部'||a.group===category)&&(!query||(a.name+" "+(a.prop_type==="laptop-computer"?"笔记本电脑 laptop computer":"")).toLowerCase().includes(query))&&(statusFilter==='all'||statusFilter==='approved'&&a.status==='approved'||statusFilter==='pending'&&a.status!=='approved'||statusFilter==='review'&&['awaiting_review','awaiting_local_repair','rejected','generation_failed','exhausted'].includes(a.status)));
 const gallery=document.querySelector('#gallery');gallery.replaceChildren();for(const a of visible){const b=document.createElement('button');b.className='action';b.setAttribute('aria-pressed',String(a.id===activeId));b.disabled=a.status!=='approved';b.setAttribute('aria-label',a.name+'，'+labels[a.status]);const poster=document.createElement('div');poster.className='poster';if(a.status==='approved'&&a.poster){const image=document.createElement('img');image.src=mediaUrl(a.poster)+'?v='+encodeURIComponent(a.sha256||'');image.loading='lazy';image.alt='';poster.append(image);}else poster.textContent=a.status==='approved'?'点击预览':labels[a.status]||a.status;const info=document.createElement('div');info.className='action-info';const title=document.createElement('div');title.className='action-name';title.textContent=a.name+(a.prop_type==="laptop-computer"?"（电脑）":"");const meta=document.createElement('div');meta.className='meta';const group=document.createElement('span');group.textContent=a.group;const state=document.createElement('span');state.className='state-'+a.status;state.textContent=labels[a.status]||a.status;meta.append(group,state);info.append(title,meta);b.append(poster,info);b.onclick=()=>activate(a);gallery.append(b);}document.querySelector('#empty').hidden=visible.length>0;document.querySelector('#result-count').textContent=`显示 ${visible.length} / ${data.actions.length} 条动作`;}
function renderCategories(){const nav=document.querySelector('#categories');nav.replaceChildren();for(const name of ['全部',...new Set(data.actions.map(a=>a.group))]){const b=document.createElement('button');b.textContent=name;b.setAttribute('aria-pressed',String(name===category));b.onclick=()=>{category=name;renderCategories();renderCards()};nav.append(b);}}
async function refresh(){try{const response=await fetch('library.json',{cache:'no-store'});if(!response.ok)throw new Error('台账读取失败');const fresh=await response.json();if(data&&data.updated_at===fresh.updated_at)return;data=fresh;const counts={};for(const a of data.actions)counts[a.status]=(counts[a.status]||0)+1;const calls=data.actions.reduce((n,a)=>n+a.attempts.length,0);document.querySelector('#stats').textContent=`已通过 ${counts.approved||0} / 106　·　生成中 ${counts.generating||0}　·　待验收 ${counts.awaiting_review||0}　·　本轮调用 ${calls} / ${data.limits.total_calls}`;document.querySelector('#progress').value=counts.approved||0;const blocker=document.querySelector('#blocker');blocker.hidden=!(data.blocker||data.production_hold);blocker.textContent=data.production_hold?'生成暂缓：连续 8 条源结果未保持纯绿底，已拦截，未继续消耗额度。当前合格素材仍可体验，正在全量复查残白、绿边和角色大小。':data.blocker?'结果回收受阻：已提交的工作状态任务出现连接异常，远端结果待核对。新增生成已停止，未重复提交。移动提示词已改为侧身步态，旧版本已撤回。':'';renderCategories();renderCards();const active=data.actions.find(a=>a.id===activeId&&a.status==='approved')||data.actions.find(a=>a.status==='approved');if(active&&activeHash!==(active.sha256||active.file))activate(active);}catch(error){document.querySelector('#stats').textContent='请通过本地 HTTP 预览服务打开此页；制作台账暂不可读取。';}}
document.querySelector('#search').oninput=e=>{query=e.target.value.trim().toLowerCase();renderCards()};
document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{statusFilter=b.dataset.status;document.querySelectorAll('[data-status]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));renderCards()});
document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-bg]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));stages.forEach(s=>s.className=`stage ${b.dataset.bg==='light'?'':b.dataset.bg}`)});
document.querySelector('#pause').onclick=function(){if(video.paused){video.play().catch(()=>{});this.textContent='暂停';this.setAttribute('aria-pressed','false')}else{video.pause();this.textContent='播放';this.setAttribute('aria-pressed','true')}};
refresh();setInterval(refresh,15000);
</script>
</html>
