<main><h1>命运石之门道具 · 第二轮12条</h1><p><a href="../../preview.html">合格动画画廊</a> · <a href="../../history.html">全部历史版本</a> · <a href="../batches/steins-props-v3-12-firstpass-01.md">本批结果清单</a></p><p id="summary">正在读取台账…</p><p class="note">这里保留未通过原片，方便批量查看。原片保留生成时的背景；透明候选也可能未通过，均不代表已上线。只加载当前选中的一条视频，点击下方动作选择播放；旧规格素材不冒充新动作。</p>
<div class="panel"><div class="label" id="title">请选择动作</div><div class="stage"><video id="video" controls muted playsinline preload="none"></video></div><div class="bar"><button id="raw" aria-pressed="false" disabled>本次原片</button><button id="candidate" aria-pressed="false" disabled>透明候选</button><button id="approved" aria-pressed="false" disabled>已通过版本</button></div><div class="label small" id="reason"></div></div><div class="list" id="list"></div></main>
<script>
const SPEC='steins-props-v3-2026-10-31',ids=['a032','a035','a036','a037','a038','a043','a044','a047','a049','a050','a055','a057'];let library=null,batch=null,chosen=null,mode='raw',loaded='';const labels={approved:'已通过',generating:'生成中',planned:'待生成',awaiting_review:'待最终验收',awaiting_source_review:'待原片验收',processing_failed:'处理未通过',rejected:'未通过',exhausted:'未通过 · 已转下一项',local_processing:'处理中',awaiting_processing:'待处理'};const media=p=>'../../'+p.split('/').map(encodeURIComponent).join('/');const getRow=id=>library.actions.find(a=>a.id===id);const attempt=a=>a.attempts.filter(t=>t.spec_revision_id===SPEC).at(-1);const player=document.querySelector('#video');
function playSelected(){if(!chosen)return;const a=getRow(chosen),t=attempt(a),paths={raw:t?.source_file,candidate:t?.candidate_file,approved:a.status==='approved'?a.file:null};if(!paths[mode])mode=paths.raw?'raw':paths.candidate?'candidate':'approved';for(const key of ['raw','candidate','approved']){const b=document.querySelector('#'+key);b.disabled=!paths[key];b.setAttribute('aria-pressed',String(key===mode));}const path=paths[mode];document.querySelector('#title').textContent=a.id+' · '+a.name+' · '+(labels[a.status]||a.status)+' · '+({raw:'生成原片',candidate:'透明候选（以当前验收状态为准）',approved:'已通过原字节成片'}[mode]);const r=batch?.rows.find(x=>x.id===a.id);document.querySelector('#reason').textContent=r?.failure_reason||((a.status==='approved')?'独立验收通过，已进入合格库。':'尚无当前最终通过记录。');const next=path?media(path)+'?v='+encodeURIComponent(mode==='raw'?t.source_sha256:mode==='candidate'?t.candidate_sha256:a.sha256):'';if(next!==loaded){player.pause();if(next)player.src=next;else player.removeAttribute('src');player.load();loaded=next;}for(const b of document.querySelectorAll('[data-id]'))b.classList.toggle('current',b.dataset.id===chosen);}
async function refresh(){try{const [l,b]=await Promise.all([fetch('../../library.json',{cache:'no-store'}).then(r=>r.json()),fetch('../batches/steins-props-v3-12-firstpass-01.json',{cache:'no-store'}).then(r=>r.json())]);library=l;batch=b;document.querySelector('#summary').textContent=`本批 ${b.total} 条：通过 ${b.passed}、当前未通过 ${b.failed}、在途/处理 ${b.in_progress}、待验收 ${b.awaiting_review}。当前规格原片 ${b.source_received}/12；原a034/a052保持原样。`;const list=document.querySelector('#list');list.replaceChildren();for(const id of ids){const a=getRow(id),t=attempt(a),button=document.createElement('button');button.dataset.id=id;button.disabled=!t?.source_file;button.textContent=id+' · '+a.name;const status=document.createElement('span');status.className='status';status.textContent=(labels[a.status]||a.status)+(t?.source_file?' · 有本次原片':' · 等待本次原片');button.append(status);button.onclick=()=>{chosen=id;mode=a.status==='approved'?'approved':'raw';playSelected();};list.append(button);}if(!chosen){chosen=ids.find(id=>getRow(id).status==='approved')||ids.find(id=>attempt(getRow(id))?.source_file);mode=chosen&&getRow(chosen).status==='approved'?'approved':'raw';}playSelected();}catch(e){document.querySelector('#summary').textContent='台账暂时读取失败，稍后重试。';}}for(const key of ['raw','candidate','approved'])document.querySelector('#'+key).onclick=()=>{mode=key;playSelected();};refresh();setInterval(refresh,30000);
</script></html>
